name: Release

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Candidate date tag (build only; no publication)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate date tag and release notes
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}(?:\.(?:[2-9]|[1-9][0-9]+))?', tag), 'Invalid date tag'
          datetime.date.fromisoformat(tag[:10])
          notes = pathlib.Path(f'docs/release-notes/{tag}.md').read_text()
          for heading in ('Input', 'Target', 'CLI', 'Behavior'):
              assert f'\n## {heading}\n' in notes, f'Missing {heading} contract'
          PY
      - name: Build and test
        run: |
          dotnet build BoxForge.slnx -c Release --no-incremental --warnaserror
          dotnet test BoxForge.slnx -c Release --no-build --no-restore
      - name: Publish self-contained CLI
        run: |
          dotnet publish src/BoxForge.Cli -c Release -r linux-x64 --self-contained true \
            -p:InformationalVersion="$RELEASE_TAG" -o "$RUNNER_TEMP/package"
          mv "$RUNNER_TEMP/package/BoxForge" "$RUNNER_TEMP/package/boxforge"
          cp README.md "$RUNNER_TEMP/package/"
          cp -r docs "$RUNNER_TEMP/package/"
          mkdir dist
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          manifest = {
              'tag': os.environ['RELEASE_TAG'],
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'sdk': subprocess.check_output(['dotnet', '--version'], text=True).strip(),
              'rid': 'linux-x64',
          }
          content = json.dumps(manifest, indent=2) + '\n'
          pathlib.Path('dist/RELEASE.json').write_text(content)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'package/RELEASE.json').write_text(content)
          PY
          tar -czf "dist/boxforge-$RELEASE_TAG-linux-x64.tar.gz" -C "$RUNNER_TEMP/package" .
          (cd dist && sha256sum "boxforge-$RELEASE_TAG-linux-x64.tar.gz" > SHA256SUMS)
      - name: Verify extracted CLI against source output
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "dist/boxforge-$RELEASE_TAG-linux-x64.tar.gz" -C "$RUNNER_TEMP/extracted"
          dotnet src/BoxForge.Cli/bin/Release/net10.0/BoxForge.dll generate \
            --input-dir "$GITHUB_WORKSPACE/Tests/BoxForge.Tests/Fixtures" \
            --output-dir "$RUNNER_TEMP/source-output" --platform all
          cd "$RUNNER_TEMP/extracted"
          ./boxforge generate --input-dir "$GITHUB_WORKSPACE/Tests/BoxForge.Tests/Fixtures" \
            --output-dir "$RUNNER_TEMP/package-output" --platform all
          diff -r "$RUNNER_TEMP/source-output" "$RUNNER_TEMP/package-output"
      - uses: actions/upload-artifact@v4
        with:
          name: boxforge-linux-x64
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: boxforge-linux-x64
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          export REMOTE_COMMIT="$remote_commit"
          python3 - <<'PY'
          import json, os, subprocess
          with open('dist/RELEASE.json') as source:
              manifest = json.load(source)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert manifest['tag'] == os.environ['RELEASE_TAG'], 'Artifact tag mismatch'
          assert manifest['commit'] == commit == os.environ['REMOTE_COMMIT'], 'Release tag moved or artifact commit mismatch'
          PY
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "BoxForge $RELEASE_TAG" --notes-file "docs/release-notes/$RELEASE_TAG.md"
