<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="将 Clash YAML 转换为 sing-box 配置压缩包">
  <title>BoxForge 配置导出</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">BOXFORGE</p>
      <h1>转换并下载 sing-box 配置</h1>
      <p class="intro">
        YAML 文件会发送到当前 BoxForge Server 完成转换，
        不会被持久保存。
      </p>
    </header>

    <form id="export-form" novalidate>
      <section class="section" aria-labelledby="file-heading">
        <div class="section-heading">
          <span class="step" aria-hidden="true">1</span>
          <div>
            <h2 id="file-heading">选择 YAML 文件</h2>
            <p>支持 .yaml 和 .yml，最大 2 MiB。</p>
          </div>
        </div>

        <div id="drop-zone" class="drop-zone">
          <label for="yaml-file">拖放文件到此处，或使用文件选择器</label>
          <input
            id="yaml-file"
            name="file"
            type="file"
            accept=".yaml,.yml,application/x-yaml,text/yaml"
            aria-describedby="file-note"
            required>
          <p id="file-note" class="file-note">尚未选择文件</p>
        </div>
      </section>

      <section class="section" aria-labelledby="options-heading">
        <div class="section-heading">
          <span class="step" aria-hidden="true">2</span>
          <div>
            <h2 id="options-heading">设置导出选项</h2>
            <p>配置名留空时使用文件名。</p>
          </div>
        </div>

        <label class="field" for="configuration-name">
          <span>配置名（可选）</span>
          <input
            id="configuration-name"
            name="name"
            type="text"
            autocomplete="off"
            placeholder="例如：example">
        </label>

        <fieldset>
          <legend>目标平台</legend>
          <div class="platforms">
            <label><input type="checkbox" name="platforms" value="Android" checked> Android</label>
            <label><input type="checkbox" name="platforms" value="Linux" checked> Linux</label>
            <label><input type="checkbox" name="platforms" value="Windows" checked> Windows</label>
          </div>
        </fieldset>
      </section>

      <div class="actions">
        <button id="submit-button" type="submit">转换并下载</button>
        <p id="status" class="status" role="status" aria-live="polite">准备就绪</p>
      </div>
    </form>
  </main>
</body>
</html>
